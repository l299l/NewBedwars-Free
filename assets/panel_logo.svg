<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#121a2e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <linearGradient id="windowFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161d2c"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <linearGradient id="headboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5533"/>
      <stop offset="100%" stop-color="#cc1100"/>
    </linearGradient>
    <linearGradient id="blanket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dd2222"/>
      <stop offset="100%" stop-color="#991111"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00aaff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0088ff"/>
      <stop offset="75%" stop-color="#00ccff"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#0088ff" flood-opacity="0.45"/>
    </filter>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff3333" flood-opacity="0.6"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <polyline points="30,72 30,30 72,30" fill="none" stroke="#0088ff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <polyline points="440,30 480,30 480,72" fill="none" stroke="#00ccff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <polyline points="30,440 30,480 72,480" fill="none" stroke="#00ccff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <polyline points="440,480 480,480 480,440" fill="none" stroke="#0088ff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <rect x="72" y="84" width="368" height="252" rx="18" fill="url(#windowFill)" stroke="#2a3a55" stroke-width="2" filter="url(#blueGlow)"/>
  <path d="M72 102 a18 18 0 0 1 18 -18 h332 a18 18 0 0 1 18 18 v20 h-368 z" fill="url(#titleBar)"/>
  <circle cx="98" cy="104" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="118" cy="104" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="138" cy="104" r="6" fill="#ffffff" opacity="0.35"/>
  <rect x="300" y="98" width="120" height="12" rx="6" fill="#ffffff" opacity="0.25"/>

  <g transform="translate(96 160)">
    <rect x="0" y="10" width="24" height="86" rx="5" fill="url(#headboard)" filter="url(#redGlow)"/>
    <rect x="132" y="32" width="24" height="64" rx="5" fill="url(#headboard)" filter="url(#redGlow)"/>
    <rect x="0" y="86" width="156" height="12" rx="3" fill="#1a0505" filter="url(#shadow)"/>
    <rect x="24" y="50" width="108" height="36" rx="5" fill="#881010"/>
    <rect x="24" y="50" width="108" height="24" rx="5" fill="url(#blanket)"/>
    <rect x="30" y="54" width="40" height="14" rx="4" fill="#ffeedd" opacity="0.93"/>
    <rect x="78" y="54" width="40" height="14" rx="4" fill="#ffe0cc" opacity="0.76"/>
    <rect x="8" y="97" width="10" height="20" rx="3" fill="#5c2a1a"/>
    <rect x="138" y="97" width="10" height="20" rx="3" fill="#5c2a1a"/>
  </g>

  <line x1="276" y1="146" x2="276" y2="306" stroke="#2a3a55" stroke-width="2"/>

  <rect x="296" y="248" width="22" height="50" rx="4" fill="url(#bar)" opacity="0.8"/>
  <rect x="326" y="218" width="22" height="80" rx="4" fill="url(#bar)" opacity="0.9"/>
  <rect x="356" y="190" width="22" height="108" rx="4" fill="url(#bar)"/>
  <rect x="386" y="230" width="22" height="68" rx="4" fill="url(#bar)" opacity="0.85"/>

  <circle cx="302" cy="158" r="6" fill="#33dd66"/>
  <rect x="316" y="153" width="92" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
  <circle cx="302" cy="178" r="6" fill="#ff4433"/>
  <rect x="316" y="173" width="64" height="10" rx="5" fill="#ffffff" opacity="0.2"/>

  <rect x="72" y="360" width="368" height="2" rx="1" fill="url(#accentLine)" opacity="0.4"/>

  <text x="256" y="425" font-family="'Segoe UI Black', 'Arial Black', Impact, sans-serif"
        font-size="56" font-weight="900" fill="#ffffff"
        text-anchor="middle" letter-spacing="4" opacity="0.95">PANEL</text>
  <text x="256" y="465" font-family="'Segoe UI', Arial, sans-serif"
        font-size="21" font-weight="700" fill="#ff4433"
        text-anchor="middle" letter-spacing="8" opacity="0.9">NEW BEDWARS</text>
</svg>
