site_name: NewBedwars
site_description: Bedwars plugin for Paper 1.17 to 26.x, with an optional web admin panel.
site_url: https://l299l.github.io/NewBedwars-Free/
repo_url: https://github.com/l299l/NewBedwars-Free
repo_name: l299l/NewBedwars-Free
edit_uri: edit/master/docs/
docs_dir: docs

exclude_docs: |
  dev/
  examples/
  requirements.txt

theme:
  name: material
  favicon: assets/logo.png
  icon:
    logo: material/bed
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Arena setup: arena-setup.md
      - Shop and upgrades: shop-and-upgrades.md
  - Reference:
      - Configuration: configuration.md
      - Commands and permissions: commands.md
      - Placeholders: placeholders.md
      - Storage: storage.md
  - Network and panel:
      - Network mode: network.md
      - Web panel: panel.md
  - Developers:
      - Addon API: api.md
