# NewBedwars-Panel - web admin panel for NewBedwars.

# Address and port the panel listens on. 0.0.0.0 = every network interface, 127.0.0.1 = this machine only.
Bind: 0.0.0.0
Port: 8150

Https:
  # true = HTTPS (recommended). false = plain HTTP: only behind a reverse proxy that adds HTTPS, or on a trusted network.
  Enabled: true
  # Your own certificate: path to a PKCS12 (.p12/.pfx) or JKS keystore, relative to this folder.
  # Empty = a self-signed certificate is created on the first start (browsers warn about it once).
  Keystore: ""
  KeystorePassword: ""
  # Extra host names or IP addresses for the self-signed certificate (e.g. panel.example.com).
  Hostnames: []

# true only when the panel runs behind your own reverse proxy: the client IP is then taken from X-Forwarded-For
# and HTTPS from X-Forwarded-Proto. Never enable it when the panel port is reachable directly.
TrustProxyHeaders: false

Session:
  # Logged out after this many minutes without activity.
  IdleMinutes: 30
  # Logged out after this many hours in any case.
  MaxHours: 12

Login:
  # Wrong passwords before the account (and the address) is locked.
  MaxAttempts: 5
  LockMinutes: 10

Upload:
  # Largest arena zip that can be uploaded for an import.
  MaxMegabytes: 512

# Panel language when the browser asks for none of the available ones: en or pl.
DefaultLanguage: en

Network:
  # STANDALONE = a single panel (default).
  # GATEWAY    = the panel you log in to (usually on the lobby server). It lists and controls the servers in Peers.
  # NODE       = a game server panel that only answers its gateway.
  Role: STANDALONE
  # Name of this server in the network (letters, digits, _ -). Empty = the NewBedwars server id.
  # On a node it must be the same as its key under Peers on the gateway.
  Id: ""
  # Shared secret, at least 32 characters, the same on the gateway and every node. Create one with /nbwpanel network secret.
  Secret: ""
  # NODE only: true = people can also log in to this node directly with accounts of this panel.
  NodeLogin: false
  # GATEWAY only: the other panels. The key is the server id (the same name the proxy uses) and must match that node's id.
  # Fingerprint: empty = trust the certificate of the first answer and remember it (peers.json),
  # a SHA-256 fingerprint = only that certificate, "system" = a normal CA-signed certificate.
  Peers: {}
  #  game1:
  #    Url: "https://10.0.0.5:8150"
  #    Fingerprint: ""

GameLog:
  # Commands typed inside an arena world are shown in the game log (admin commands such as /bw game or /gamemode).
  # Commands listed here are not: player commands. A two-word entry like "bw lobby" leaves out only that subcommand.
  # Login and password commands are never logged.
  IgnoredCommands: [lobby, hub, leave, lang, party, p, msg, tell, w, whisper, m, r, reply, me, list, help, "?", rejoin,
    "bw join", "bw rejoin", "bw lobby", "bw lang", "bw spectate", "bw stats", "bw profile", "bw leaderboard", "bw help"]
