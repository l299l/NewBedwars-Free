NetworkArenaInfo: "&b&l=-= &fArènes sur un réseau &b&l=-=\n&7Ceci est un &eserveur lobby&7: il n'a pas d'arènes. Les arènes se trouvent sur les &eserveurs de jeu&7 (Network.Mode: GAME).\n&f1. &7Connectez-vous à un serveur de jeu (Velocity: &e/server <name>&7) et configurez-y les arènes comme sur un serveur unique: &e/bw arena create&7, configuration, &e/bw arena enable&7.\n&f2. &7Créez les groupes d'arènes &eici sur le lobby&7 avec &e/bw group&7: &e/bw group add <group> <arena>&7 ajoute cette arène de chaque serveur de jeu, &e<server>:<arena>&7 une seule. Les serveurs de jeu reçoivent les groupes automatiquement (la connexion et le vote de map entre serveurs les utilisent).\n&f3. &7Même map sur plusieurs serveurs: &e/bw arena export <arena>&7 sur l'un crée un zip (arène + map) dans plugins/NewBedwars/data/exports; copiez-le dans le même dossier de l'autre serveur, puis utilisez-y &e/bw arena import <file>.zip&7 (elle arrive désactivée: &e/bw arena enable <arena>&7).\n&f4. &7Les sauvegardes, restaurations et réinitialisations de map se font sur le serveur de jeu qui possède l'arène.\n&7Voyez toutes les arènes d'ici avec &e/bw arena list&7 (un serveur de jeu apparaît dès qu'un joueur y est en ligne, ou toujours avec MySQL)."
