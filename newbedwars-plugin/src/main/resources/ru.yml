NetworkArenaInfo: "&b&l=-= &fАрены в сети &b&l=-=\n&7Это &eсервер лобби&7: на нём нет арен. Арены находятся на &eигровых серверах&7 (Network.Mode: GAME).\n&f1. &7Подключитесь к игровому серверу (Velocity: &e/server <name>&7) и настройте там арены как на одиночном сервере: &e/bw arena create&7, настройка, &e/bw arena enable&7.\n&f2. &7Создавайте группы арен &eздесь, в лобби&7, командой &e/bw group&7: &e/bw group add <group> <arena>&7 добавляет эту арену со всех игровых серверов, &e<server>:<arena>&7 — только одну. Игровые серверы получают группы автоматически (вход в игру и голосование за карту между серверами используют их).\n&f3. &7Одна и та же карта на нескольких серверах: &e/bw arena export <arena>&7 на одном создаёт zip (арена + карта) в plugins/NewBedwars/data/exports; скопируйте его в ту же папку на другом сервере, затем выполните там &e/bw arena import <file>.zip&7 (она появится отключённой: &e/bw arena enable <arena>&7).\n&f4. &7Резервные копии, восстановление и сброс карт выполняются на игровом сервере, где находится арена.\n&7Все арены можно увидеть отсюда командой &e/bw arena list&7 (игровой сервер появляется, когда на нём есть игрок, или всегда при использовании MySQL)."
