# =====================================================
#  NewBedwars - Main configuration
# =====================================================
# Other files in plugins/NewBedwars:
#   data/items.yml        shop items
#   data/upgrades.yml     upgrade and trap prices per level
#   data/guis/*.yml       shop and upgrade GUIs
#   generators/*.yml      generator speeds and levels
#   scoreboards.yml, bossBars.yml, language/*.yml
# Docs: https://l299l.github.io/NewBedwars-Free/


# ----- General ------------------------------------

# Shown on scoreboards and boss bars (/servername/, /server_name/).
ServerName: "&6&lExample&f&lServer.com"

# Language for new players and the console: en, pl, de, es, fr or ru.
# You can add your own language file to the language folder.
DefaultLanguage: en


# ----- Arena defaults -----------------------------
# Used for new arenas. Every arena can change them in setup mode.

DefaultMinPlayers: 4
DefaultMaxInTeam: 4
# Seconds of countdown in the waiting lobby.
DefaultWaitingTime: 20
# Seconds a dead player waits before respawning.
DefaultRespawnTime: 5
DefaultTeamShopGui: exampleShop
DefaultTeamUpgradeGui: exampleUpgrade
# Built-in modes: Solo, Doubles, Squads, Rush, Duels (generators/<Mode>.yml and modes.yml).
# DefaultGenerators and the Default phases are the old pre-2.8 values, kept for existing arenas (deprecated).
DefaultGeneratorConfig: Squads
# ID of a phase list from GamePhases in modes.yml.
DefaultGamePhase: Squads


# ----- Default gamerules --------------------------
# Apply to all arenas unless an arena overrides them (/bw gamerule).

DefaultGamerules:
  RandomTeams: true
  AllowParties: true
  AllowSpectators: true
  AllowTeamChat: true
  AllowGlobalChat: true
  AllowPrivateChat: true
  AllowTeamDamage: false
  MakeSwordsPermanent: false
  # true: pickaxe, axe and shears are kept after death; false: they are lost on respawn.
  MakeToolsPermanent: true
  AllowMultipleGolems: false
  # When all players would end up in a single team (e.g. one big party), true splits the
  # party over other teams so the game can start; false keeps waiting for more players.
  SplitPartiesToStart: true
  # In a grouped arena, players vote for the next map at the end of the game (see MapVote below); false = no vote.
  MapVote: true
  # Players in the waiting lobby get an item (and /bw team) to pick their team; players who don't pick are placed automatically at start.
  TeamSelection: false
  # true: a team can only be picked while it is one of the least picked teams (keeps teams even); false: any team with a free slot.
  TeamSelectionBalanced: true
  # With AllowParties: true = only the party leader picks and the whole party joins that team; false = every member picks on their own.
  TeamSelectionPartyLeader: true
  # true: players waiting to respawn (bed still alive) can watch every team with the spectator compass; false: only their own team.
  # Eliminated players and /bw spectate spectators can always watch everyone.
  AllowSpectatingOtherTeams: true
  # false: normal chat goes to the whole arena and a message starting with ! to your team only.
  # true: the other way round (normal chat to your team, ! to the whole arena). Players without a team always chat with everyone.
  TeamChatByDefault: false


# ----- Gameplay -----------------------------------

# Starting sword every player receives (a shop item ID from data/items.yml).
BasicSword: WoodenSword

# Give players a full set of team-coloured armor at game start.
FullArmor: false

# Players who disconnect can come back with /bw rejoin.
RejoinTimeLimitEnabled: true
# Minutes a player has to rejoin after disconnecting.
RejoinTime: 5

# Leaving with the bed item asks for a confirmation: click once to start the countdown, again to cancel.
BedLeaveConfirmEnabled: true
# Seconds of that countdown.
BedLeaveConfirmDelay: 3

# Seconds players can look around after the game ends before the arena resets.
AfterGameWatchTime: 30

# What players get every second before the game starts (waiting lobby countdown).
# Enabled: false = turn that part off.
# LastSeconds: 0 = every second; 3 = only during the last 3 seconds, and so on.
StartCountdown:
  Title:
    Enabled: true
    LastSeconds: 0
  Chat:
    Enabled: true
    LastSeconds: 0
  Sound:
    Enabled: true
    LastSeconds: 0

# Red particles above players carrying TNT.
TntParticlesEnabled: true

# Seconds an iron golem bought in the shop stays alive.
IronGolemLifetime: 120


# ----- Chat and tab list --------------------------

# false = players inside arenas can not send chat messages at all.
# The arena gamerules AllowTeamChat and AllowGlobalChat are also respected.
# Start a message with ! to send it to your team only (e.g. !hello team); the gamerule TeamChatByDefault reverses this.
ArenaChatEnabled: true

# Players outside arenas (the lobby) see "<player> joined/left the game" when someone joins or leaves the server.
# The vanilla join/leave messages are always hidden. false = no such message at all.
# The texts are PlayerJoinedServer and PlayerLeftServer in the language files: /player/ and {player} are the
# player's name, and PlaceholderAPI placeholders (e.g. %vault_prefix%) are filled in for that player.
LobbyJoinMessages: true


# true = every arena has its own tab list: players in an arena only see the players of that arena,
# and lobby players don't see arena players either.
TablistIsolationEnabled: true

# Custom tab list (header, footer and player names), layouts are in tablists.yml.
# Enabled: false = the plugin never touches the tab list header, footer or player names.
# Layout used by arenas that don't have their own (/bw setTablist or the Tablist key of a mode).
Tablist:
  Enabled: true
DefaultTablist: Default


# ----- Game phases and modes ----------------------
# Game phases (GamePhases) and modes (Modes) are in modes.yml.


# ----- Ender Dragons ------------------------------
# Spawned by ENDER_DRAGON_START for every team with the Dragon Buff upgrade.

# Blocks above the team spawn where the dragons are summoned.
DragonSpawnHeight: 10

# Blocks a dragon can not destroy (Bukkit Material names). Beds are never destroyed.
DragonIndestructibleBlocks:
  - OBSIDIAN
  - BEDROCK
  - BARRIER
  - END_PORTAL_FRAME
  - IRON_BARS

Dragon:
  # Flight speed in blocks per tick.
  Speed: 0.6
  # How fast a dragon can turn, in degrees per tick.
  TurnRate: 6.0
  # Patrol height above the highest team spawn, bed or generator.
  PatrolHeight: 15
  # Radius of the patrol circle around the map center (0 = automatic).
  PatrolRadius: 0
  # How far outside the bases and generators a dragon may fly.
  Margin: 10
  # Maximum distance at which a dragon picks a target.
  TargetRange: 128
  # Horizontal distance at which a dragon starts a dive attack.
  AttackRange: 20
  # Seconds between fireballs for Dragon Buff level 1, 2, ...
  FireballIntervalSeconds: [20, 10]
  # Starting speed of the fireballs in blocks per tick.
  FireballSpeed: 1.0


# ----- Map voting ---------------------------------
# Arenas can be put into groups (/bw group). When a game in a grouped arena ends, everyone still there gets a
# vote item and votes for the next map among the group's other free arenas during AfterGameWatchTime.
# When the time is up, everyone joins the waiting lobby of the map with most votes (a tie or no votes picks
# randomly). If no arena of the group is free, everyone goes to the lobby as usual.

MapVote:
  Item:
    # Hotbar slot and material of the vote item. Slots 0, 4 and 8 hold spectator items, so they fall back to 2.
    Slot: 1
    Material: PAPER


# ----- Team selector ------------------------------
# Team selector item given in the waiting lobby when the TeamSelection gamerule is on. Slot 0-7 (slot 8 is the leave item).

TeamSelector:
  Item:
    Slot: 0
    Material: WHITE_WOOL


# ----- Maps and backups ---------------------------
# The map of every arena is stored as a pristine template in plugins/NewBedwars/data/maps/<arena>/template.
# After each game the arena world is replaced by a fresh copy of that template, so a crash or
# an accidental save can never damage the map. Edit the map in setup mode, then use /bw save.

Rollback:
  # true = use the OLD system (unload the world and reload it from the server folder, no templates).
  UseLegacySystem: false
  # Copy the template on a separate thread (recommended for big maps).
  AsyncCopy: true
  # Also restore the maps when the plugin is disabled (slower server stop, but maps are always clean).
  # When false, a map that was in use is restored on the next start instead.
  RestoreOnShutdown: false
  # Ticks to wait between attempts when the arena world can not be unloaded yet.
  UnloadRetryTicks: 10
  # Files and folders that are not copied into the template.
  TemplateExcludes:
    - session.lock
    - uid.dat
    - playerdata
    - stats
    - advancements

Backups:
  # How many automatic arena file / map backups are kept per arena.
  Keep: 5


# ----- Automatic arena setup ----------------------
# /bw startAutomaticSetup scans the built map around you for beds, generator blocks and marker signs.

AutomaticSetup:
  # Scan radius in blocks when none is given, and the largest radius that is allowed.
  DefaultRadius: 150
  MaxRadius: 400
  # How many blocks around a bed an iron or gold block counts as that team's generator.
  GeneratorSearchRadius: 20
  # Team base area: blocks added around the points of a team on the sides, below and above.
  BasePadding: 8
  BaseBelow: 5
  BaseAbove: 15


# ----- Join NPCs ----------------------------------
# Lobby NPCs that join a game when clicked. Make one with Citizens (/npc create, /npc select)
# and attach it with /bw npc set <GROUP|ARENA|SELECTOR> [target],
# or without Citizens: /bw npc create <entityType> <action> [target].

JoinNpc:
  # How often (seconds) the holograms above the NPCs are updated.
  UpdateSeconds: 2
  # Also run the action on a left click (right click always works).
  LeftClick: false
  # Hologram lines per action (empty list = no hologram). Placeholders: /group/, /arena/, /playing/,
  # /waiting/, /arenas_free/, /players/, /max/, /status/
  Hologram:
    # Move the hologram up (positive) or down (negative), e.g. -0.3 when the NPC name is hidden.
    Offset: 0.0
    GROUP:
      - "&b&l/group/"
      - "&7Playing: &f/playing/ &8| &7Waiting: &f/waiting/"
      - "&eClick to play!"
    ARENA:
      - "&b&l/arena/"
      - "&7Players: &f/players/&7/&f/max/ &8| &7/status/"
      - "&eClick to join!"
    SELECTOR:
      - "&b&lBedWars"
      - "&7Playing: &f/playing/ &8| &7Free arenas: &f/arenas_free/"
      - "&eClick to choose an arena!"


# ----- Storage ------------------------------------
# Where player data (language, quick buy) and stats are kept.
# JSON  = files in plugins/NewBedwars/data (default, one server).
# MYSQL = the MySQL/MariaDB database below. Use MYSQL on every server of a network so stats are shared.
#         On the first start with an empty database, the JSON data of this server is imported.
#         When MySQL is useful (also on one server): docs/storage.md in the NewBedwars repository.

Storage:
  Type: JSON

# MySQL/MariaDB connection, used by Storage.Type: MYSQL and Network.MySQL (uses the driver that ships with the server).
MySQL:
  Host: "localhost"
  Port: 3306
  Database: "newbedwars"
  User: "root"
  Password: ""
  # DISABLED, PREFERRED (encrypt when the server supports it), REQUIRED, VERIFY_CA or VERIFY_IDENTITY.
  SslMode: PREFERRED
  # Only needed for MySQL 8 accounts with caching_sha2_password on a connection without SSL. Less secure.
  AllowPublicKeyRetrieval: false

# ----- Leaderboards -------------------------------
# PlaceholderAPI: %newbedwars_top_<stat>_<position>_name% and %newbedwars_top_<stat>_<position>_value%
# (stat: wins, kills, final_kills or beds; position 1-10), for example in a hologram plugin.
# How often these placeholders are refreshed, in seconds (at least 5).
Leaderboards:
  RefreshSeconds: 60

# ----- Updates ------------------------------------
# NewBedwars looks for new versions on Modrinth (and GitHub as a fallback). Nothing about your server is sent.

Updates:
  # false = never contact Modrinth/GitHub (also disables /bw update).
  Check: true
  # Tell the console and admins (permission newbedwars.update.notify, one chat line on join) about a new version.
  Notify: true
  # true = download a new version (checksum verified) into plugins/update/; it is installed on the next restart.
  AutoDownload: false
  # Which versions to offer: RELEASE, BETA (releases and betas) or ALPHA (everything).
  Channel: BETA
  # Hours between checks.
  CheckIntervalHours: 12


# ----- Network mode (Velocity) -------------------
# NONE  = single server (default, nothing below is used).
# GAME  = this server hosts arenas; players come from the proxy and go back to a lobby server.
# LOBBY = this server has no arenas; /bw join, the arena selector and join NPCs send players to game servers.
# Needs the NewBedwars-Proxy plugin on Velocity. See docs/network.md.

Network:
  Mode: NONE
  # The name of THIS server in the Velocity config (velocity.toml [servers]).
  ServerId: ""
  # GAME: lobby server to send players to. Empty = let the proxy pick the least full lobby.
  LobbyServer: ""
  # GAME: false (default) = game servers need no lobby: players who arrive or leave a game wait invisibly
  #        (spectator mode, at the world spawn) for the moment until they are put into an arena or moved on.
  # true  = old behaviour: they are teleported to this server's /bw setLobby location (or the world spawn).
  LocalLobby: false
  # LOBBY: show "<player> joined/left the game" to players in the lobby (also when they switch servers).
  # Game servers never show it: arenas announce joins themselves.
  LobbyJoinMessages: true
  # GAME: restart the server (Bukkit shutdown, your start script must start it again) after this many
  # finished games, as soon as every arena is empty. 0 = never.
  RestartAfterGames: 0
  # GAME: how long (seconds) a player who arrives from the proxy waits for the arena to join before going back.
  TicketTimeoutSeconds: 10
  # GAME: how often (seconds) the arena list is sent to the proxy while players are online.
  StatePublishSeconds: 5
  # GAME: optional shared status table (nbw_servers) so the proxy sees game servers with no players online.
  # Uses the MySQL connection above.
  MySQL:
    Enabled: false
    HeartbeatSeconds: 5
