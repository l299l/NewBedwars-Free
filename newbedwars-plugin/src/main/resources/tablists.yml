# =====================================================
#  NewBedwars - Tab list layouts
#
#  Header / Footer are lists of lines (joined with a new line), PlayerFormat is how a player's
#  name is shown in the tab list. Use & colour codes. PlaceholderAPI placeholders (%...%) work too
#  when PlaceholderAPI is installed.
#
#  Placeholders:
#    {player}       - the player's name
#    {teamColor}    - the colour code of the player's team (empty without a team)
#    {teamName}     - the team's display name (empty without a team)
#    {teamShort}    - the first letter of the team's name (empty without a team)
#    {arena}        - arena name
#    {players}      - players in the arena
#    {maxPlayers}   - arena capacity
#    {minPlayers}   - players needed to start
#    {phase}        - name of the next game phase
#    {phaseTime}    - time until the next phase
#    {gameTime}     - time since the game started
#    {kills}, {finalKills}, {bedsBroken} - the player's own stats in this game
#    {server}       - server name (ServerName in config.yml)
#    {online}       - players online on this server
#
#  Which layout an arena uses: /bw setTablist <layout> (setup, advanced), the Tablist key of a mode
#  in modes.yml (copied by /bw setMode), otherwise DefaultTablist in config.yml.
#  An unknown layout falls back to "Default". Tablist.Enabled: false in config.yml turns everything off
#  (vanilla names, header and footer are restored).
# =====================================================

# Shown to players that are not in an arena. Off by default: lobby players keep the vanilla tab list.
Lobby:
  Enabled: false
  Header:
    - ""
    - "&6&lBedWars"
    - "&7{online} players online"
  Footer:
    - ""
  PlayerFormat: "&7{player}"

Layouts:
  Default:
    # Waiting lobby and countdown.
    Waiting:
      Header:
        - ""
        - "&6&lBedWars &7- &e{arena}"
        - "&7Players: &f{players}&7/&f{maxPlayers}"
      Footer:
        - ""
        - "&7Waiting for the game to start"
      PlayerFormat: "{teamColor}{player}"
    # Running game. Missing keys fall back to Waiting.
    Playing:
      Header:
        - ""
        - "&6&lBedWars &7- &e{arena}"
        - "&7Next: &f{phase} &7in &f{phaseTime}"
      Footer:
        - ""
        - "&7Kills: &f{kills} &8| &7Final kills: &f{finalKills} &8| &7Beds: &f{bedsBroken}"
      PlayerFormat: "{teamColor}[{teamShort}] {player}"
    # Used for spectators (their own list name and header/footer). Missing keys fall back to Playing.
    Spectator:
      PlayerFormat: "&7{player}"
