# =====================================================
#  NewBedwars — Boss Bar Configuration
#
#  Each boss bar cycles through its Texts, Colors,
#  Styles, and Effects at the given interval (Time, seconds).
#
#  Colors:  BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
#  Styles:  SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
#  Effects: NONE, RAINBOW, PULSING, RAINBOW_PULSING
#  Actions: NONE, END_GAME
#
#  Texts: {lang:Key} (or /lang:Key/) is replaced by that message key (en.yml, pl.yml, ...) in each
#  viewer's language, before the other placeholders and colours. A text with it is shown per player.
#  The shipped texts use keys (BossBar*). Existing files keep their own texts.
# =====================================================

BossBars:
  WaitingBeforeStart:
    Enabled: true
    Time: 5
    Texts:
      - "{lang:BossBarWaitingServer}"
      - "{lang:BossBarWaitingPlayers}"
    Colors:  ["GREEN", "YELLOW"]
    Styles:  ["SOLID", "SEGMENTED_6"]
    Effects: ["NONE", "NONE"]
    Action: "NONE"

  GameInProgress:
    Enabled: true
    Time: 5
    Texts:
      - "{lang:BossBarGamePhase}"
      - "{lang:BossBarGamePlayers}"
    Colors:  ["GREEN", "YELLOW"]
    Styles:  ["SOLID", "SOLID"]
    Effects: ["NONE", "NONE"]
    Action: "NONE"

  GameEnding:
    Enabled: true
    Time: 0
    Texts:
      - "{lang:BossBarEndGame}"
    Colors:  ["PURPLE"]
    Styles:  ["SOLID"]
    Effects: ["NONE"]
    Action: "END_GAME"

  # Shown to players in the lobby (not in an arena). /players/ counts the lobby players and the players in arenas, /max_players/ the slots of all enabled arenas.
  MainLobby:
    Enabled: false
    Time: 5
    Texts:
      - "{lang:BossBarLobbyPlaying}"
      - "{lang:BossBarLobbyJoin}"
      - "{lang:BossBarLobbyPlayers}"
    Colors:  ["GREEN", "YELLOW", "RED"]
    Styles:  ["SOLID", "SEGMENTED_6", "SEGMENTED_10"]
    Effects: ["RAINBOW", "PULSING", "RAINBOW_PULSING"]
    Action: "NONE"
