# =====================================================
#  NewBedwars — Scoreboard Configuration
#
#  Placeholders:
#    /datetime/                 — current date & time
#    /map/                      — arena name
#    /players/                  — player count
#    /maxplayers/               — max players
#    /status/                   — arena status
#    /servername/               — server name (from config.yml)
#    /server/                   — network mode: this server's name in the proxy (Network.ServerId);
#                                 a line with /server/ is left out on a single server
#    /phase/                    — current game phase name
#    /phaseTime/                — time remaining in phase
#    /teams/                    — team list (in-game)
#    /bed/                      — bed status icon
#    /yourteam/                 — player's own team indicator
#    /player.stats.kills/       — player kill count
#    /player.stats.final_kills/ — player final kill count
#    /player.stats.beds_broken/ — player beds broken count
#
#  {lang:Key} (or /lang:Key/) in a line or the title is replaced by that message key (en.yml, pl.yml, ...)
#  in the viewer's language, before the other placeholders and colours. The shipped lines use keys
#  (ScoreboardLine*). Existing files keep their own texts.
#
#  TitleEffect: NONE | RAINBOW
# =====================================================

Scoreboards:
  WaitingScoreboard:
    Enabled: true
    Title: '&6&lBedWars'
    TitleEffect: 'RAINBOW'
    Lines:
      - '&7/datetime/'
      - ''
      - '{lang:ScoreboardLineMap}'
      - '{lang:ScoreboardLineServer}'
      - '{lang:ScoreboardLinePlayers}'
      - ''
      - '&6&l/status/'
      - ''
      - '&6/servername/'

  InGameScoreboard:
    Enabled: true
    Title: '&6&lBedWars'
    TitleEffect: 'RAINBOW'
    Lines:
      - '&7/datetime/'
      - ''
      - '{lang:ScoreboardLinePhase}'
      - ''
      - '/teams/: /bed/ /yourteam/'
      - ''
      - '{lang:ScoreboardLineKills}'
      - '{lang:ScoreboardLineFinalKills}'
      - '{lang:ScoreboardLineBedsBroken}'
      - ''
      - '&6/servername/'

  EndingScoreboard:
    Enabled: true
    Title: '&6&lBedWars'
    TitleEffect: 'RAINBOW'
    Lines:
      - '&7/datetime/'
      - ''
      - '{lang:ScoreboardLineMap}'
      - ''
      - '{lang:ScoreboardLineKills}'
      - '{lang:ScoreboardLineFinalKills}'
      - '{lang:ScoreboardLineBedsBroken}'
      - ''
      - '&6/servername/'
