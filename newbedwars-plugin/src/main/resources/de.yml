NetworkArenaUsage: "&b[NewBedwars] &8&l> &7Dies ist ein Lobby-Server: &e/bw arena list &7(Arenas aller Spielserver) und &e/bw arena info &7(wie man Arenas in einem Netzwerk einrichtet)."
NetworkGroupOnLobby: "&b[NewBedwars] &8&l> &cIm Netzwerkmodus werden Arena-Gruppen auf dem Lobby-Server festgelegt (&e/bw group &cdort). Hier kannst du nur &e/bw group list &cund &e/bw group info &cverwenden."
