NetworkArenaListServer: "&e/server/&7:"
NetworkArenaListEntry: "  &7- &f/arena/ &8| &7Gruppe &f/group/ &8| &7/state/ &8| &f/players/&7//max/ &8| &7/teams/"
NetworkArenaInfo: "&b&l=-= &fArenas in einem Netzwerk &b&l=-=\n&7Dies ist ein &eLobby-Server&7: Er hat keine Arenas. Arenas liegen auf den &eSpielservern&7 (Network.Mode: GAME).\n&f1. &7Verbinde dich mit einem Spielserver (Velocity: &e/server <name>&7) und richte dort Arenas wie auf einem einzelnen Server ein: &e/bw arena create&7, Einrichtung, &e/bw arena enable&7.\n&f2. &7Erstelle Arena-Gruppen &ehier in der Lobby&7 mit &e/bw group&7: &e/bw group add <group> <arena>&7 fügt diese Arena von jedem Spielserver hinzu, &e<server>:<arena>&7 nur eine. Die Spielserver erhalten die Gruppen automatisch (Beitritt und Map-Abstimmung über mehrere Server nutzen sie).\n&f3. &7Dieselbe Map auf mehreren Servern: &e/bw arena export <arena>&7 auf einem erstellt eine Zip (Arena + Map) in plugins/NewBedwars/data/exports; kopiere sie in denselben Ordner auf dem anderen Server und führe dort &e/bw arena import <file>.zip&7 aus (sie kommt deaktiviert an: &e/bw arena enable <arena>&7).\n&f4. &7Backups, Wiederherstellung und Map-Resets erfolgen auf dem Spielserver, der die Arena hat.\n&7Alle Arenas siehst du von hier mit &e/bw arena list&7 (ein Spielserver erscheint, sobald ein Spieler dort online ist, oder immer mit MySQL)."
