NetworkArenaInfo: "&b&l=-= &fArenas en una red &b&l=-=\n&7Este es un &eservidor de lobby&7: no tiene arenas. Las arenas están en los &eservidores de juego&7 (Network.Mode: GAME).\n&f1. &7Conéctate a un servidor de juego (Velocity: &e/server <name>&7) y configura allí las arenas como en un servidor único: &e/bw arena create&7, configuración, &e/bw arena enable&7.\n&f2. &7Crea los grupos de arenas &eaquí en el lobby&7 con &e/bw group&7: &e/bw group add <group> <arena>&7 añade esa arena de cada servidor de juego, &e<server>:<arena>&7 solo una. Los servidores de juego reciben los grupos automáticamente (la unión y la votación de mapas entre servidores los usan).\n&f3. &7El mismo mapa en varios servidores: &e/bw arena export <arena>&7 en uno crea un zip (arena + mapa) en plugins/NewBedwars/data/exports; cópialo en la misma carpeta del otro servidor y luego usa allí &e/bw arena import <file>.zip&7 (llega desactivada: &e/bw arena enable <arena>&7).\n&f4. &7Las copias de seguridad, restauraciones y reinicios de mapa se hacen en el servidor de juego que tiene la arena.\n&7Mira todas las arenas desde aquí con &e/bw arena list&7 (un servidor de juego aparece cuando hay un jugador conectado en él, o siempre con MySQL)."
