NetworkGroupOnLobby: "&b[NewBedwars] &8&l> &cEn modo red, los grupos de arenas se configuran en el servidor de lobby (&e/bw group&c allí). Aquí solo puedes usar &e/bw group list&c y &e/bw group info&c."
